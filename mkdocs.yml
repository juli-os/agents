site_name: '@juli-os/agents'
docs_dir: docs
strict: true
theme:
  name: material
  language: zh
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - 首页: index.md
  - 架构: gen/architecture.md
  - API 参考: api/index.md
